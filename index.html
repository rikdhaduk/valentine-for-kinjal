<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>For Kinjal ❤️</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, sans-serif;
      background: radial-gradient(circle at top, #ffe6f2 0, #ffd1e6 40%, #ffc2dd 70%, #ffb3d4 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    /* Floating hearts background */
    .heart-float {
      position: fixed;
      width: 14px;
      height: 14px;
      background: #ff4d88;
      transform: rotate(-45deg);
      opacity: 0.45;
      animation: floatUp 10s linear infinite;
      z-index: 0;
    }
    .heart-float::before,
    .heart-float::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      background: #ff4d88;
      border-radius: 50%;
    }
    .heart-float::before {
      top: -7px;
      left: 0;
    }
    .heart-float::after {
      left: 7px;
      top: 0;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(-45deg);
        opacity: 0;
      }
      10% {
        opacity: 0.4;
      }
      90% {
        opacity: 0.4;
      }
      100% {
        transform: translateY(-120vh) rotate(-45deg);
        opacity: 0;
      }
    }

    .card {
      position: relative;
      background: rgba(255, 255, 255, 0.97);
      padding: 26px 28px 30px;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.15);
      text-align: center;
      max-width: 380px;
      width: 90%;
      z-index: 1;
      backdrop-filter: blur(4px);
      animation: popIn 0.7s ease;
    }

    @keyframes popIn {
      0% { transform: scale(0.9) translateY(10px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    h1 {
      margin: 0 0 12px;
      color: #ff4d88;
      font-size: 1.6rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Beating heart near the title */
    .big-heart {
      width: 20px;
      height: 20px;
      background: #ff4d88;
      position: relative;
      transform: rotate(-45deg);
      animation: heartbeat 1s infinite;
    }
    .big-heart::before,
    .big-heart::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      background: #ff4d88;
      border-radius: 50%;
    }
    .big-heart::before {
      top: -10px;
      left: 0;
    }
    .big-heart::after {
      left: 10px;
      top: 0;
    }

    @keyframes heartbeat {
      0%   { transform: scale(1) rotate(-45deg); }
      25%  { transform: scale(1.25) rotate(-45deg); }
      45%  { transform: scale(1.5) rotate(-45deg); }
      60%  { transform: scale(1.25) rotate(-45deg); }
      100% { transform: scale(1) rotate(-45deg); }
    }

    .subtitle {
      font-size: 0.9rem;
      color: #555;
      margin-bottom: 18px;
    }

    /* Love meter */
    .meter-label {
      font-size: 0.8rem;
      color: #777;
      margin-bottom: 4px;
      text-align: left;
    }

    .meter {
      position: relative;
      height: 8px;
      border-radius: 999px;
      background: #ffe1f0;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .meter-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff4d88, #ff8fb8);
      transition: width 0.4s ease;
    }

    .question {
      font-size: 1.05rem;
      margin: 14px 0 22px;
      color: #333;
      min-height: 52px;
    }

    .btn-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 10px 18px;
      border-radius: 999px;
      background: #ff4d88;
      color: white;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s;
    }

    button:hover {
      background: #ff336f;
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .secondary {
      background: #ffe1f0;
      color: #ff4d88;
    }
    .secondary:hover {
      background: #ffd1e6;
      color: #ff185f;
    }

    .hidden {
      display: none;
    }

    .fade {
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .small {
      font-size: 0.85rem;
      color: #777;
      margin-top: 10px;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <!-- Simple floating hearts, positions tweaked in JS -->
  <div class="heart-float"></div>
  <div class="heart-float"></div>
  <div class="heart-float"></div>
  <div class="heart-float"></div>
  <div class="heart-float"></div>

  <div class="card">
    <h1>
      Hi Kinjal
      <span class="big-heart"></span>
    </h1>
   
    <div class="meter-label">Love meter: <span id="meterText">warming up…</span></div>
    <div class="meter">
      <div class="meter-fill" id="meterFill"></div>
    </div>

    <!-- Step 1 -->
    <div id="step1" class="fade">
      <div class="question">
        Question 1:<br>
        Do you like spending time with me?
      </div>
      <div class="btn-row">
        <button onclick="answerAndNext(35, 2, 'I like that answer already 😌')">Of course 💖</button>
        <button class="secondary" onclick="answerAndNext(30, 2, 'Noted. I like it too. ✨')">Yes 😌</button>
      </div>
    </div>

    <!-- Step 2 -->
    <div id="step2" class="hidden">
      <div class="question">
        Question 2:<br>
        Do you know how special you are to me?
      </div>
      <div class="btn-row">
        <button onclick="answerAndNext(70, 3, 'Correct. Extremely special. 🥹')">I have a hint 😊</button>
        <button class="secondary" onclick="answerAndNext(65, 3, 'Let me show you a little more… 💫')">Tell me more ✨</button>
      </div>
    </div>

    <!-- Step 3 -->
    <div id="step3" class="hidden">
      <div class="question">
        Final question:<br>
        Kinjal, will you be my valentine?
      </div>
      <div class="btn-row">
	<button onclick="sayYes()">Yes 💘</button>
	<button id="noBtn" class="secondary" onclick="runAway()">No 🙈</button>
      </div>
      <div class="small" id="hint"></div>
    </div>

    <!-- Result -->
    <div id="result" class="hidden">
      <div class="question">
        Yaaay! 🥹💞<br>
        Thank you, Kinjal. You just made my day.
      </div>
	<div class="small">
  	Screenshot this, coz I’m definitely keeping it 💖
	</div>
    </div>
  </div>

  <script>
    // Randomize background hearts
    const hearts = document.querySelectorAll('.heart-float');
    hearts.forEach((h, i) => {
      const startX = Math.random() * 100;
      const delay = Math.random() * 8;
      const duration = 8 + Math.random() * 6;
      h.style.left = startX + 'vw';
      h.style.bottom = (-10 - i * 10) + 'vh';
      h.style.animationDuration = duration + 's';
      h.style.animationDelay = delay + 's';
      h.style.opacity = 0.2 + Math.random() * 0.5;
      const scale = 0.8 + Math.random() * 1.3;
      h.style.transform = 'scale(' + scale + ') rotate(-45deg)';
    });

    const steps = ['step1', 'step2', 'step3'];
    const meterFill = document.getElementById('meterFill');
    const meterText = document.getElementById('meterText');

    function showStep(id) {
      steps.forEach(s => {
        const el = document.getElementById(s);
        if (el) el.classList.add('hidden');
      });
      const target = document.getElementById(id);
      if (target) {
        target.classList.remove('hidden');
        target.classList.add('fade');
      }
    }

    function updateMeter(percent, text) {
      meterFill.style.width = percent + '%';
      meterText.textContent = text;
    }

    function answerAndNext(percent, nextStep, text) {
      updateMeter(percent, text);
      showStep('step' + nextStep);
    }

    function sayYes() {
      updateMeter(100, 'Maximum possible. 💘');
      steps.forEach(s => {
        const el = document.getElementById(s);
        if (el) el.classList.add('hidden');
      });
      document.getElementById('result').classList.remove('hidden');
      document.getElementById('result').classList.add('fade');
      launchMiniConfetti();
    }

    function runAway() {
      const noBtn = document.getElementById('noBtn');
      const hint = document.getElementById('hint');
      const card = document.querySelector('.card');
      const rect = card.getBoundingClientRect();

      const maxX = rect.width - 140;
      const maxY = rect.height - 120;
      const x = Math.random() * maxX - maxX / 2;
      const y = Math.random() * maxY - maxY / 2;

      noBtn.style.position = 'relative';
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';

      hint.textContent = "Hmm, seems like this button is broken. Maybe try the shiny pink one instead 😉";
    }

    // Tiny confetti burst using simple spans
    function launchMiniConfetti() {
      const count = 20;
      for (let i = 0; i < count; i++) {
        const piece = document.createElement('span');
        piece.textContent = '❤';
        piece.style.position = 'fixed';
        piece.style.left = 50 + (Math.random() * 20 - 10) + 'vw';
        piece.style.top = '40vh';
        piece.style.fontSize = (14 + Math.random() * 12) + 'px';
        piece.style.pointerEvents = 'none';
        piece.style.zIndex = 999;
        piece.style.color = Math.random() > 0.5 ? '#ff4d88' : '#ff8fb8';

        const translateX = (Math.random() * 40 - 20);
        const translateY = 60 + Math.random() * 20;
        const duration = 1500 + Math.random() * 600;

        piece.animate(
          [
            { transform: 'translate(0, 0)', opacity: 1 },
            { transform: 'translate(' + translateX + 'px,' + translateY + 'px)', opacity: 0 }
          ],
          {
            duration: duration,
            easing: 'ease-out'
          }
        );

        document.body.appendChild(piece);

        setTimeout(() => {
          piece.remove();
        }, duration + 100);
      }
    }
  </script>
</body>
</html>
